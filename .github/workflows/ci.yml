name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Full run, then check the published site data is current
        run: |
          cp assets/data/site.json /tmp/site.before.json
          ./scripts/build.sh
          python - <<'PY'
          import json
          a, b = json.load(open("/tmp/site.before.json")), json.load(open("assets/data/site.json"))
          assert a["contracts"] == b["contracts"], "contract results changed: rerun scripts/build.sh and commit"
          assert a["products"] == b["products"], "products changed: rerun scripts/build.sh and commit"
          print("site data matches a fresh run")
          PY
