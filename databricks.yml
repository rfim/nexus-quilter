# Databricks Asset Bundle: the same package runs locally (scripts/build.sh) and as a Databricks job.
bundle:
  name: nexus-quilter

variables:
  catalog:
    default: nexus
  warehouse_id:
    description: SQL warehouse the dbt Data Vault runs on
    default: ""

resources:
  jobs:
    nexus_daily:
      name: nexus-daily
      tags: {owning_team: data-platform, workload: transform}
      health:
        rules: [{metric: RUN_DURATION_SECONDS, op: GREATER_THAN, value: 2700}]
      email_notifications:
        on_failure: [vim@example.com]
      schedule:
        quartz_cron_expression: "0 30 5 ? * MON-FRI"
        timezone_id: Europe/London
      tasks:
        - task_key: pipeline
          python_wheel_task: {package_name: nexus, entry_point: pipeline}
          environment_key: default
        - task_key: data_vault          # dbt: hubs, links and satellites, then the marts and their tests
          depends_on: [{task_key: pipeline}]
          dbt_task:
            project_directory: dbt
            catalog: "${var.catalog}"
            schema: vault
            warehouse_id: "${var.warehouse_id}"
            commands: ["dbt deps", "dbt seed", "dbt build"]
          environment_key: dbt
      environments:
        - environment_key: default
          spec: {client: "2", dependencies: [pyyaml]}
        - environment_key: dbt
          spec: {client: "2", dependencies: ["dbt-databricks>=1.10,<2"]}
      parameters:
        - {name: NEXUS_CATALOG, default: "${var.catalog}"}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    variables:
      catalog: nexus
